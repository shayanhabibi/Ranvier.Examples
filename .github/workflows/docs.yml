name: Docs
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the source code
      - uses: actions/checkout@v7
      # Setup dotnet, please use a global.json to ensure the right SDK is used!
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # The library multi-targets net10.0, and the runner's preinstalled SDK is older, so
          # without this the build fails before any test runs.
          dotnet-version: '10.0.x'
      # Generate the documentation files
      - name: Generate the documentation
        run: dotnet fsi build.fsx -- docs
      # Upload the static files
      - name: Upload documentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./output

  # GitHub Actions recommends deploying in a separate job.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
