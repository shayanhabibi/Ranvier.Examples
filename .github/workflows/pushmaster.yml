name: Verify examples
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore tools
        run: dotnet tool restore
      - name: Check formatting
        run: dotnet fsi build.fsx -- format --dry-format
      - name: Build all applications
        run: dotnet fsi build.fsx -- build --quick
      - name: Test models, bindings and desktop windows
        run: dotnet fsi build.fsx -- test --quick
      - name: Run console scenarios
        run: |
          dotnet fsi build.fsx -- run-fsharp-console
          dotnet fsi build.fsx -- run-csharp-console
          dotnet fsi build.fsx -- run-data-console
          dotnet fsi build.fsx -- run-elmish-console
          dotnet run --no-build -c Release --project src/Ranvier.Examples.FSharp.Console -- intro
          dotnet run --no-build -c Release --project src/Ranvier.Examples.CSharp.Console -- intro
      - name: Verify dependency sources are unchanged
        run: |
          test -z "$(git -C external/Ranvier status --porcelain)"
          git submodule status
